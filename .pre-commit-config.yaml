repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier-check
        # Pin to the version in package.json — an unpinned bunx downloads the
        # latest prettier in CI (no node_modules there), which drifts from the
        # repo's formatting and fails on files formatted with the pinned version.
        entry: bunx prettier@3.8.4 --check .
        language: system
        pass_filenames: false
